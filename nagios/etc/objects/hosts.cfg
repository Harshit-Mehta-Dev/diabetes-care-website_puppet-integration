define host {
    use                     linux-server
    host_name               diabetes-node
    alias                   Diabetes Care Production Node
    address                 127.0.0.1
    max_check_attempts      3
    check_period            24x7
    notification_interval   30
    notification_period     24x7
}

define hostgroup {
    hostgroup_name          diabetes-servers
    alias                   Diabetes Care Infrastructure Servers
    members                 diabetes-node
}
