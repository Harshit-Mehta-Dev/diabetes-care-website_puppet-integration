# HTTP Health Check on Port 1012
define service {
    use                     generic-service
    host_name               diabetes-node
    service_description     HTTP Web Endpoint
    check_command           check_http_port!1012!/
    check_interval          1
    retry_interval          1
    max_check_attempts      3
    check_period            24x7
    notification_interval   15
    notification_period     24x7
}

# Docker Container Health Check
define service {
    use                     generic-service
    host_name               diabetes-node
    service_description     Docker Container Status
    check_command           check_docker_container!diabetes-care-app
    check_interval          2
    retry_interval          1
    max_check_attempts      3
    check_period            24x7
    notification_interval   15
    notification_period     24x7
}

# CPU and Host Load Check
define service {
    use                     generic-service
    host_name               diabetes-node
    service_description     Current Load & CPU
    check_command           check_local_load!5.0,4.0,3.0!10.0,6.0,4.0
    check_interval          5
    retry_interval          1
    max_check_attempts      3
}

# Disk Space Check
define service {
    use                     generic-service
    host_name               diabetes-node
    service_description     Root Disk Usage
    check_command           check_local_disk!20%!10%!/
    check_interval          10
    retry_interval          2
    max_check_attempts      3
}
